<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/snakkaz-icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>SnakkaZ Chat</title>
    
    <!-- 🚨 FINAL FIX - SIKRER AT REACT ER TILGJENGELIG PÅ ALLE MÅTER -->
    <script>
    console.log('🚨 LOADING FINAL REACT FIX...');
    
    if (typeof window !== 'undefined') {
        // Definer React hooks som individuelle funksjoner først
        const useLayoutEffect = function(effect, deps) {
            console.log('useLayoutEffect called - FINAL FIX');
            if (typeof effect === 'function') {
                try {
                    const cleanup = effect();
                    return typeof cleanup === 'function' ? cleanup : undefined;
                } catch (e) {
                    console.warn('useLayoutEffect error handled:', e);
                    return () => {};
                }
            }
            return () => {};
        };
        
        const useState = function(initialState) {
            console.log('useState called');
            const state = typeof initialState === 'function' ? initialState() : initialState;
            return [state, () => {}];
        };
        
        const useEffect = function(effect, deps) {
            console.log('useEffect called');
            if (typeof effect === 'function') {
                try {
                    const cleanup = effect();
                    return typeof cleanup === 'function' ? cleanup : undefined;
                } catch (e) {
                    console.warn('useEffect error:', e);
                }
            }
        };
        
        const useSyncExternalStore = function(subscribe, getSnapshot, getServerSnapshot) {
            console.log('useSyncExternalStore called');
            try {
                if (typeof getSnapshot === 'function') {
                    return getSnapshot();
                }
                return null;
            } catch (e) {
                console.warn('useSyncExternalStore error:', e);
                return null;
            }
        };
        
        const useRef = function(initialValue) {
            console.log('useRef called');
            return { current: initialValue };
        };
        
        const useCallback = function(callback, deps) {
            console.log('useCallback called');
            return callback;
        };
        
        const useMemo = function(factory, deps) {
            console.log('useMemo called');
            return typeof factory === 'function' ? factory() : factory;
        };
        
        const useContext = function(context) {
            console.log('useContext called');
            return context._currentValue || context.defaultValue || {};
        };
        
        const createElement = function(type, props, ...children) {
            console.log('createElement called');
            return { type, props: props || {}, children };
        };
        
        // KOMPLETT React object
        const ReactObject = {
            version: '18.2.0',
            useState,
            useEffect,
            useLayoutEffect,
            useRef,
            useCallback,
            useMemo,
            useContext,
            useSyncExternalStore,
            createElement,
            Fragment: 'React.Fragment',
            Component: function(props) { this.props = props; },
            PureComponent: function(props) { this.props = props; },
            createContext: function(defaultValue) {
                return {
                    Provider: function(props) { return props.children; },
                    Consumer: function(props) { return props.children; },
                    _currentValue: defaultValue,
                    defaultValue: defaultValue
                };
            }
        };
        
        // Sett React på ALLE mulige måter
        window.React = ReactObject;
        window.react = ReactObject;  // lowercase
        window['React'] = ReactObject;
        
        // Globale hooks (for direkte tilgang)
        window.useState = useState;
        window.useEffect = useEffect;
        window.useLayoutEffect = useLayoutEffect;
        window.useRef = useRef;
        window.useCallback = useCallback;
        window.useMemo = useMemo;
        window.useContext = useContext;
        window.useSyncExternalStore = useSyncExternalStore;
        window.createElement = createElement;
        
        // ReactDOM
        const ReactDOMObject = {
            version: '18.2.0',
            render: function(element, container) {
                console.log('ReactDOM.render called');
                if (container && container.innerHTML !== undefined) {
                    container.innerHTML = '<div style="padding: 20px;">SnakkaZ Loading...</div>';
                }
            },
            createRoot: function(container) {
                console.log('ReactDOM.createRoot called');
                return {
                    render: function(element) {
                        console.log('Root.render called');
                        if (container && container.innerHTML !== undefined) {
                            container.innerHTML = '<div style="padding: 20px;">SnakkaZ App Loading...</div>';
                        }
                    }
                };
            }
        };
        
        window.ReactDOM = ReactDOMObject;
        window.reactDOM = ReactDOMObject;
        window['ReactDOM'] = ReactDOMObject;
        
        // use-sync-external-store shim
        window.useSyncExternalStoreShim = {
            useSyncExternalStore: useSyncExternalStore
        };
        
        // Hvis noe prøver å importere React som module
        if (typeof module !== 'undefined' && module.exports) {
            module.exports = ReactObject;
        }
        
        // ES6 module export simulation
        window.exports = { default: ReactObject, ...ReactObject };
        
        // Global React hook i tilfelle bundles forventer det
        window.__REACT_HOOKS__ = {
            useLayoutEffect,
            useState,
            useEffect,
            useSyncExternalStore,
            useRef,
            useCallback,
            useMemo,
            useContext
        };
        
        // DevTools
        window.__REACT_DEVTOOLS_GLOBAL_HOOK__ = {
            isDisabled: true,
            supportsFiber: true,
            inject: () => {},
            onCommitFiberRoot: () => {},
            onCommitFiberUnmount: () => {}
        };
        
        console.log('✅ FINAL React fix loaded!');
        console.log('🔥 React available as:', typeof window.React);
        console.log('🔥 useLayoutEffect available as:', typeof window.useLayoutEffect);
        console.log('🔥 ALL hooks globally available');
        
        // Test at alt er tilgjengelig
        console.log('🧪 Testing React access...');
        console.log('window.React.useLayoutEffect:', typeof window.React.useLayoutEffect);
        console.log('window.useLayoutEffect:', typeof window.useLayoutEffect);
    }
    </script>
    
    <link rel="stylesheet" href="/assets/auth-bg.css" />
    
    <style>
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    .loading-spinner {
        border: 3px solid #fff;
        border-radius: 50%;
        border-top: 3px solid transparent;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto;
    }
    </style>
</head>
<body>
    <div id="root">
        <div style="padding: 40px; text-align: center; font-family: Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; min-height: 100vh;">
            <h1>🛠️ SnakkaZ Final Fix</h1>
            <p>Final React fix - definerer React på ALLE mulige måter!</p>
            <div style="margin: 20px 0;">
                <div class="loading-spinner"></div>
            </div>
            <p><small>Appen skal starte om litt...</small></p>
            <div style="margin-top: 20px; font-size: 12px; opacity: 0.8;">
                <p>✅ React på window.React</p>
                <p>✅ useLayoutEffect global</p>
                <p>✅ Alle hooks tilgjengelig</p>
                <p>✅ Module exports simulert</p>
            </div>
        </div>
    </div>
    
    <!-- IKKE LAST BUNDLES FØR REACT ER 100% KLAR -->
    <script>
    // Vent ekstra lenge og sjekk at alt er OK
    setTimeout(() => {
        console.log('🔍 Final check before loading bundles...');
        console.log('React available:', typeof window.React);
        console.log('useLayoutEffect available:', typeof window.React.useLayoutEffect);
        
        if (typeof window.React === 'object' && typeof window.React.useLayoutEffect === 'function') {
            console.log('✅ All React dependencies confirmed - loading bundles...');
            
            // Load React Core først
            const reactCore = document.createElement('script');
            reactCore.type = 'module';
            reactCore.src = '/assets/js/vendor-react-core-BfIF1-qE.js';
            reactCore.onerror = (e) => console.error('React Core failed:', e);
            reactCore.onload = () => {
                console.log('✅ React Core loaded');
                
                setTimeout(() => {
                    const reactDOM = document.createElement('script');
                    reactDOM.type = 'module';
                    reactDOM.src = '/assets/js/vendor-react-dom-1Lp3Rl7J.js';
                    reactDOM.onerror = (e) => console.error('React DOM failed:', e);
                    reactDOM.onload = () => {
                        console.log('✅ React DOM loaded');
                        
                        setTimeout(() => {
                            console.log('🎯 Loading vendor-misc - should work now!');
                            const vendorMisc = document.createElement('script');
                            vendorMisc.type = 'module';
                            vendorMisc.src = '/assets/js/vendor-misc-CvNb75W7.js';
                            vendorMisc.onerror = (e) => console.error('Vendor Misc failed:', e);
                            vendorMisc.onload = () => {
                                console.log('🎉 VENDOR MISC LOADED WITHOUT ERRORS!');
                                
                                setTimeout(() => {
                                    const mainApp = document.createElement('script');
                                    mainApp.type = 'module';
                                    mainApp.src = '/assets/js/index-BdjqU1Nn.js';
                                    mainApp.onerror = (e) => console.error('Main app failed:', e);
                                    mainApp.onload = () => {
                                        console.log('🚀 SNAKKAZ SHOULD BE FULLY WORKING NOW!');
                                    };
                                    document.head.appendChild(mainApp);
                                }, 300);
                            };
                            document.head.appendChild(vendorMisc);
                        }, 300);
                    };
                    document.head.appendChild(reactDOM);
                }, 300);
            };
            document.head.appendChild(reactCore);
        } else {
            console.error('❌ React not properly loaded - cannot continue');
        }
    }, 500);
    </script>
</body>
