    <!-- EMERGENCY REACT FIX - ULTRA CRITICAL -->
    <script>
        console.log('🚀 EMERGENCY: Applying ULTIMATE React hooks fix...');
        
        // Create global React object if it doesn't exist
        window.React = window.React || {};
        
        // Create React hooks shim
        window.React.useLayoutEffect = window.React.useLayoutEffect || function(effect, deps) {
            console.log('✅ EMERGENCY: useLayoutEffect shim called');
            return React.useEffect ? React.useEffect(effect, deps) : effect();
        };
        
        window.React.useState = window.React.useState || function(initial) {
            console.log('✅ EMERGENCY: useState shim called');
            return [initial, function() {}];
        };
        
        window.React.useEffect = window.React.useEffect || function(effect, deps) {
            console.log('✅ EMERGENCY: useEffect shim called');
            if (typeof effect === 'function') {
                effect();
            }
        };
        
        window.React.useMemo = window.React.useMemo || function(factory, deps) {
            console.log('✅ EMERGENCY: useMemo shim called');
            return typeof factory === 'function' ? factory() : factory;
        };
        
        window.React.useCallback = window.React.useCallback || function(callback, deps) {
            console.log('✅ EMERGENCY: useCallback shim called');
            return callback;
        };
        
        window.React.useRef = window.React.useRef || function(initial) {
            console.log('✅ EMERGENCY: useRef shim called');
            return { current: initial };
        };
        
        // Ensure React hooks are available globally
        if (typeof window.useLayoutEffect === 'undefined') {
            window.useLayoutEffect = window.React.useLayoutEffect;
        }
        
        console.log('✅ EMERGENCY: ULTIMATE React hooks fix applied');
        console.log('📊 Available React methods:', Object.keys(window.React));

    <!-- Load React and ReactDOM first -->
    <script type="module">
        console.log('🔄 Loading React core modules...');
        
        // Pre-initialize React hooks before loading vendor bundles
        window.React = window.React || {};
        
        // Import React core first
        import('/assets/js/vendor-react-core-dw-u3J8o.js').then(() => {
            console.log('✅ React core loaded');
            
            // Then load other vendor scripts
            return import('/assets/js/vendor-misc-1EIi_gUb.js');
        }).then(() => {
            console.log('✅ Vendor misc loaded');
            
            // Finally load main application
            return import('/assets/js/main-CV7YYFEy.js');
        }).then(() => {
            console.log('✅ Main application loaded');
            console.log('🎉 Snakkaz Chat fully initialized!');
        }).catch(error => {
            console.error('❌ Error loading modules:', error);
            
            // Fallback - try loading with script tags
            const scripts = [
                '/assets/js/vendor-react-core-dw-u3J8o.js',
                '/assets/js/vendor-misc-1EIi_gUb.js', 
                '/assets/js/main-CV7YYFEy.js'
            ];
            
            let loadedCount = 0;
            scripts.forEach((src, index) => {
                const script = document.createElement('script');
                script.type = 'module';
                script.src = src;
                script.onload = () => {
                    loadedCount++;
                    console.log(`✅ Fallback loaded: ${src}`);
                    if (loadedCount === scripts.length) {
                        console.log('🎉 Fallback loading complete!');
                    }
                };
                script.onerror = () => {
                    console.error(`❌ Failed to load: ${src}`);
                };
                document.head.appendChild(script);
            });
        });
    </script>
