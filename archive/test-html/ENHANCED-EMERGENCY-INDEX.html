            try {
                console.log(`🔄 Attempting to load ${name} from ${src}...`);
                
                // Pre-check if the file exists
                const response = await fetch(src, { method: 'HEAD' });

                    throw new Error(`Module not found: ${response.status} ${response.statusText}`);

                const module = await import(src);
                console.log(`✅ ${name} loaded successfully`);

                console.error(`❌ Failed to load ${name}:`, error.message);
                
                // Try alternative paths if main fails

                        '/assets/js/vendor-react-BdXK3LHl.js',
                        '/assets/js/react-vendor.js',
                        '/assets/js/vendor.js'
