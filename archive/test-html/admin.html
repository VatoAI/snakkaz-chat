<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snakkaz MCP Admin Portal</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-router-dom@6/dist/index.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
            min-height: 100vh;
        }

        .admin-portal {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .login-container {
            background: rgba(26, 26, 26, 0.95);
            border: 1px solid #ffd700;
            border-radius: 12px;
            padding: 2rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(255, 215, 0, 0.1);
            backdrop-filter: blur(10px);
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo h1 {
            color: #ffd700;
            font-size: 2rem;
            font-weight: bold;
            margin: 0;
            text-shadow: 0 2px 4px rgba(255, 215, 0, 0.3);
        }

        .logo p {
            color: #888;
            margin: 0.5rem 0 0 0;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            color: #ffd700;
            font-weight: 500;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #333;
            border-radius: 6px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #ffd700;
            box-shadow: 0 0 0 2px rgba(255, 215, 0, 0.2);
        }

        .login-btn {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(255, 215, 0, 0.3);
        }

        .login-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 0.75rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #333;
            border-radius: 50%;
            border-top-color: #ffd700;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .security-features {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid #333;
        }

        .security-feature {
            display: flex;
            align-items: center;
            color: #888;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
        }

        .security-feature::before {
            content: "🔒";
            margin-right: 0.5rem;
        }

        .two-factor-section {
            background: rgba(255, 215, 0, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 8px;
            padding: 1.5rem;
            margin-top: 1rem;
        }

        .two-factor-title {
            color: #ffd700;
            font-weight: bold;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
        }

        .two-factor-title::before {
            content: "🔐";
            margin-right: 0.5rem;
        }
    </style>
</head>
<body>
    <div id="admin-portal-root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { createRoot } = ReactDOM;

        // Mock auth service for demonstration
        const AdminAuthService = {
            login: async (credentials) => {
                // Simulate API call
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                if (credentials.step === 'credentials') {
                    if (credentials.username === 'admin' && credentials.password === 'demo123') {
                        return { requiresTwoFactor: true };
                    } else {
                        throw new Error('Invalid credentials');
                    }
                } else if (credentials.step === 'totp') {
                    if (credentials.totpCode === '123456') {
                        return { success: true, token: 'demo-token' };
                    } else {
                        throw new Error('Invalid TOTP code');
                    }
                }
            }
        };

        const AdminLogin = () => {
            const [formData, setFormData] = useState({
                username: '',
                password: '',
                totpCode: ''
            });
            
            const [showTwoFactor, setShowTwoFactor] = useState(false);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const [loginAttempts, setLoginAttempts] = useState(0);
            const [isLocked, setIsLocked] = useState(false);

            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({
                    ...prev,
                    [name]: value
                }));
                if (error) setError('');
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                
                if (isLocked) {
                    setError('Account locked due to too many failed attempts. Please try again later.');
                    return;
                }

                setLoading(true);
                setError('');

                try {
                    if (!showTwoFactor) {
                        const response = await AdminAuthService.login({
                            username: formData.username,
                            password: formData.password,
                            step: 'credentials'
                        });
                        
                        if (response.requiresTwoFactor) {
                            setShowTwoFactor(true);
                        }
                    } else {
                        const response = await AdminAuthService.login({
                            username: formData.username,
                            password: formData.password,
                            totpCode: formData.totpCode,
                            step: 'totp'
                        });
                        
                        if (response.success) {
                            window.location.href = '/admin/dashboard';
                        }
                    }
                } catch (error) {
                    setError(error.message);
                    setLoginAttempts(prev => prev + 1);
                    
                    if (loginAttempts >= 4) {
                        setIsLocked(true);
                        setError('Account locked due to too many failed attempts.');
                    }
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="admin-portal">
                    <div className="login-container">
                        <div className="logo">
                            <h1>Snakkaz MCP</h1>
                            <p>Admin Portal</p>
                        </div>

                        {error && (
                            <div className="error-message">
                                {error}
                            </div>
                        )}

                        <form onSubmit={handleSubmit}>
                            {!showTwoFactor ? (
                                <>
                                    <div className="form-group">
                                        <label htmlFor="username">Username</label>
                                        <input
                                            type="text"
                                            id="username"
                                            name="username"
                                            value={formData.username}
                                            onChange={handleInputChange}
                                            required
                                            disabled={loading || isLocked}
                                            placeholder="Enter admin username"
                                        />
                                    </div>

                                    <div className="form-group">
                                        <label htmlFor="password">Password</label>
                                        <input
                                            type="password"
                                            id="password"
                                            name="password"
                                            value={formData.password}
                                            onChange={handleInputChange}
                                            required
                                            disabled={loading || isLocked}
                                            placeholder="Enter admin password"
                                        />
                                    </div>
                                </>
                            ) : (
                                <div className="two-factor-section">
                                    <div className="two-factor-title">
                                        Two-Factor Authentication
                                    </div>
                                    <div className="form-group">
                                        <label htmlFor="totpCode">TOTP Code</label>
                                        <input
                                            type="text"
                                            id="totpCode"
                                            name="totpCode"
                                            value={formData.totpCode}
                                            onChange={handleInputChange}
                                            required
                                            disabled={loading}
                                            placeholder="Enter 6-digit code"
                                            maxLength="6"
                                        />
                                    </div>
                                    <p style={{color: '#888', fontSize: '0.8rem', margin: '0.5rem 0'}}>
                                        Enter the 6-digit code from your authenticator app
                                    </p>
                                </div>
                            )}

                            <button 
                                type="submit" 
                                className="login-btn"
                                disabled={loading || isLocked}
                            >
                                {loading ? (
                                    <>
                                        <span className="loading"></span>
                                        <span style={{marginLeft: '0.5rem'}}>
                                            {showTwoFactor ? 'Verifying...' : 'Authenticating...'}
                                        </span>
                                    </>
                                ) : (
                                    showTwoFactor ? 'Verify & Login' : 'Login'
                                )}
                            </button>
                        </form>

                        <div className="security-features">
                            <div className="security-feature">
                                Two-factor authentication required
                            </div>
                            <div className="security-feature">
                                Session timeout protection
                            </div>
                            <div className="security-feature">
                                Encrypted communications
                            </div>
                            <div className="security-feature">
                                Audit logging enabled
                            </div>
                        </div>

                        <div style={{marginTop: '2rem', textAlign: 'center', color: '#666', fontSize: '0.8rem'}}>
                            Demo credentials: admin / demo123<br/>
                            Demo TOTP: 123456
                        </div>
                    </div>
                </div>
            );
        };

        // Render the admin login
        const root = createRoot(document.getElementById('admin-portal-root'));
        root.render(<AdminLogin />);
    </script>
</body>
</html>
