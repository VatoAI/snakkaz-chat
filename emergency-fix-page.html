<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnakkaZ Chat - Emergency Fix</title>
    <style>
        body { 
            background: #0f172a; 
            color: #f1f5f9; 
            font-family: system-ui, -apple-system, sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        .container { 
            text-align: center; 
            max-width: 500px; 
            padding: 2rem; 
        }
        .logo { 
            font-size: 2rem; 
            font-weight: bold; 
            color: #f59e0b; 
            margin-bottom: 1rem; 
        }
        .status { 
            color: #10b981; 
            margin: 1rem 0; 
        }
        .error { 
            color: #ef4444; 
        }
        button { 
            background: #f59e0b; 
            color: #0f172a; 
            border: none; 
            padding: 12px 24px; 
            border-radius: 6px; 
            font-weight: 600; 
            cursor: pointer; 
            margin: 10px; 
        }
        button:hover { 
            background: #d97706; 
        }
    </style>
</head>
<body>
    <!-- EMERGENCY REACT FIX - Loaded immediately -->
    <script>
        console.log('🚨 SNAKKAZ EMERGENCY HOTFIX - Loading...');
        
        // Fix the specific "Nt is undefined" error
        if (typeof window.Nt === 'undefined') {
            window.Nt = function(initialState) {
                console.log('🔧 Emergency Nt called with:', initialState);
                return [initialState, function(newValue) {
                    console.log('🔧 Emergency Nt setter:', newValue);
                }];
            };
            console.log('✅ Fixed Nt undefined error');
        }
        
        // Fix other minified React variables
        const reactVars = ['Mt', 'Pt', 'Qt', 'Rt', 'St', 'Tt', 'Ut', 'Vt', 'Wt'];
        reactVars.forEach(function(varName) {
            if (typeof window[varName] === 'undefined') {
                window[varName] = function(initialState) {
                    return [initialState, function() {}];
                };
                console.log('✅ Fixed ' + varName + ' undefined error');
            }
        });
        
        // Ensure React namespace exists
        if (!window.React) {
            window.React = {};
        }
        
        // Provide emergency useState
        if (!window.React.useState) {
            window.React.useState = function(initialState) {
                console.log('🔧 Emergency React.useState called');
                return [initialState, function() {}];
            };
        }
        
        // Provide emergency useSyncExternalStore
        if (!window.React.useSyncExternalStore) {
            window.React.useSyncExternalStore = function(subscribe, getSnapshot) {
                console.log('🔧 Emergency React.useSyncExternalStore called');
                try {
                    return getSnapshot ? getSnapshot() : null;
                } catch (e) {
                    console.warn('useSyncExternalStore error:', e);
                    return null;
                }
            };
        }
        
        // Global useSyncExternalStore
        if (!window.useSyncExternalStore) {
            window.useSyncExternalStore = window.React.useSyncExternalStore;
        }
        
        // Enable use-sync-external-store polyfill
        window.__USE_SYNC_EXTERNAL_STORE_POLYFILL__ = true;
        
        console.log('✅ SNAKKAZ EMERGENCY HOTFIX - Applied successfully!');
        
        // Test the fix
        setTimeout(function() {
            try {
                if (window.Nt) {
                    var test = window.Nt('test');
                    console.log('✅ Nt test successful:', test);
                    document.getElementById('status').innerHTML = '<span style="color: #10b981;">✅ Emergency fix applied successfully!</span>';
                } else {
                    throw new Error('Nt still undefined');
                }
            } catch (e) {
                console.error('❌ Fix verification failed:', e);
                document.getElementById('status').innerHTML = '<span style="color: #ef4444;">❌ Fix verification failed</span>';
            }
        }, 100);
    </script>

    <div class="container">
        <div class="logo">🐍 SnakkaZ Chat</div>
        <h1>Emergency React Fix</h1>
        <p>Fixing critical "Nt is undefined" error...</p>
        <div id="status" class="status">🔄 Applying fix...</div>
        
        <div style="margin-top: 2rem;">
            <button onclick="window.location.reload()">Test Reload</button>
            <button onclick="window.location.href='/'">Go to Main Site</button>
        </div>
        
        <div style="margin-top: 2rem; font-size: 0.9rem; opacity: 0.7;">
            <p>This emergency fix resolves the React state synchronization error</p>
            <p>that was causing the black screen on www.snakkaz.com</p>
        </div>
    </div>

    <script>
        // Additional verification after DOM load
        window.addEventListener('load', function() {
            console.log('🧪 Running additional tests...');
            
            // Test React hooks
            if (window.React && window.React.useState) {
                console.log('✅ React.useState available');
            }
            
            if (window.useSyncExternalStore) {
                console.log('✅ useSyncExternalStore available');
            }
            
            console.log('🎯 Emergency fix verification complete');
        });
    </script>
</body>
</html>
