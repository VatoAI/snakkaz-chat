<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/snakkaz-icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>SnakkaZ Chat</title>
    
    <!-- 🚨 ULTIMATE REACT FIX - BÅDE REACT OG USE-SYNC-EXTERNAL-STORE -->
    <script>
    console.log('🚨 LOADING FINAL REACT FIX...');
    
    // Definer React og alle hooks direkte
    if (typeof window !== 'undefined') {
        // Full React implementasjon
        window.React = {
            version: '18.2.0',
            useState: function(initialState) {
                return [typeof initialState === 'function' ? initialState() : initialState, function() {}];
            },
            useReducer: function(reducer, initialState) {
                return [initialState, function() {}];
            },
            useEffect: function(effect, deps) {
                if (typeof effect === 'function') setTimeout(effect, 0);
            },
            useLayoutEffect: function(effect, deps) {
                if (typeof effect === 'function') setTimeout(effect, 0);
            },
            useCallback: function(callback) { return callback; },
            useMemo: function(factory) { return typeof factory === 'function' ? factory() : factory; },
            useRef: function(initialValue) { return { current: initialValue }; },
            useContext: function(context) { return context._currentValue || {}; },
            createContext: function(defaultValue) {
                return {
                    _currentValue: defaultValue,
                    Provider: function() {},
                    Consumer: function() {}
                };
            },
            createElement: function(type, props, ...children) {
                return { type, props: props || {}, children };
            },
            Fragment: 'Fragment',
            StrictMode: function(props) { return props && props.children; },
            Component: function() { this.setState = function() {}; },
            PureComponent: function() { this.setState = function() {}; },
            memo: function(component) { return component; },
            forwardRef: function(render) { return render; },
            createRef: function() { return { current: null }; }
        };
        
        // Legg til alle hooks direkte på window også
        window.useState = window.React.useState;
        window.useEffect = window.React.useEffect;
        window.useLayoutEffect = window.React.useLayoutEffect;
        window.useCallback = window.React.useCallback;
        window.useMemo = window.React.useMemo;
        window.useRef = window.React.useRef;
        window.useContext = window.React.useContext;
        window.useReducer = window.React.useReducer;
        
        // ReactDOM
        window.ReactDOM = {
            version: '18.2.0',
            render: function(element, container) {
                if (container) container.innerHTML = '<div>SnakkaZ Loading...</div>';
            },
            createRoot: function(container) {
                return {
                    render: function(element) {
                        if (container) container.innerHTML = '<div>SnakkaZ Loading...</div>';
                    }
                };
            },
            findDOMNode: function() { return null; }
        };
        
        // Dev tools hook
        window.__REACT_DEVTOOLS_GLOBAL_HOOK__ = window.__REACT_DEVTOOLS_GLOBAL_HOOK__ || {
            supportsFiber: true,
            renderers: new Map(),
            inject: function() { return 0; }
        };
        
        // KRITISK: use-sync-external-store fix!
        window.useSyncExternalStore = function(subscribe, getSnapshot) {
            return getSnapshot();
        };
        
        // KRITISK: useSyncExternalStoreWithSelector fix
        window.useSyncExternalStoreWithSelector = function(subscribe, getSnapshot, getServerSnapshot, selector, equalityFn) {
            const value = getSnapshot();
            return selector ? selector(value) : value;
        };
        
        console.log('✅ FINAL React fix loaded!');
        console.log('🔥 React available as:', typeof window.React);
        console.log('🔥 useLayoutEffect available as:', typeof window.useLayoutEffect);
        console.log('🔥 ALL hooks globally available');
        
        // Verifiser at fixen fungerer
        console.log('🧪 Testing React access...');
        console.log('window.React.useLayoutEffect:', typeof window.React.useLayoutEffect);
        console.log('window.useLayoutEffect:', typeof window.useLayoutEffect);
    }
    </script>
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        .loading-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
            color: white;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px 0;
        }
        .status-list {
            list-style-type: none;
            text-align: left;
            width: 100%;
            max-width: 500px;
            padding: 0 20px;
            margin: 20px 0;
        }
        .status-list li {
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        .status-list li::before {
            content: "✓ ";
            color: #4ade80;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    
    <script type="module">
        // Proxy console.log for debugging
        const oldLog = console.log;
        console.log = function() {
            const args = Array.from(arguments);
            
            // Add debug ID to each log
            const debugElement = document.getElementById('debug-log');
            if (debugElement && args[0] && typeof args[0] === 'string') {
                const log = document.createElement('div');
                log.textContent = args[0];
                debugElement.appendChild(log);
            }
            
            return oldLog.apply(console, args);
        };
        
        // Funksjon som sjekker React-status
        window.checkReactStatus = function() {
            console.log('🔍 Final check before loading bundles...');
            console.log('React available: ' + typeof window.React);
            console.log('useLayoutEffect available: ' + typeof window.useLayoutEffect);
            
            try {
                if (typeof window.React === 'object' && typeof window.useLayoutEffect === 'function') {
                    console.log('✅ All React dependencies confirmed - loading bundles...');
                    return true;
                } else {
                    console.error('❌ React not correctly initialized!');
                    return false;
                }
            } catch (e) {
                console.error('❌ Error checking React status:', e);
                return false;
            }
        };
        
        // Modifiser window.onload for å legge til vår egen kode
        const originalOnload = window.onload;
        window.onload = function() {
            setTimeout(() => {
                // Wait a bit to make sure everything is ready
                const rootDiv = document.getElementById('root');
                if (!rootDiv.children.length || rootDiv.children[0].classList.contains('loading-screen')) {
                    console.log('⚠️ App not loaded yet, retrying React initialization...');
                    
                    // Fjern loading-screen
                    document.querySelector('.loading-screen')?.remove();
                    
                    // Reload scripts
                    loadAppScripts();
                }
            }, 5000);
            
            // Call original onload if it exists
            if (typeof originalOnload === 'function') {
                originalOnload();
            }
        };
        
        // Function to load app scripts in correct order
        function loadAppScripts() {
            // Check if React is ready
            if (!window.checkReactStatus()) {
                console.error('❌ Cannot load scripts - React not ready');
                return;
            }
            
            // Create and append script - React Core
            const reactCoreScript = document.createElement('script');
            reactCoreScript.src = '/assets/js/vendor-react-core-BfIF1-qE.js';
            reactCoreScript.type = 'module';
            reactCoreScript.onload = () => {
                console.log('✅ React Core loaded');
                
                // Load React DOM only after React Core is loaded
                const reactDomScript = document.createElement('script');
                reactDomScript.src = '/assets/js/vendor-react-dom-1Lp3Rl7J.js';
                reactDomScript.type = 'module';
                reactDomScript.onload = () => {
                    console.log('✅ React DOM loaded');
                    
                    // Now load vendor-misc
                    const vendorMiscScript = document.createElement('script');
                    vendorMiscScript.src = '/assets/js/vendor-misc-CvNb75W7.js';
                    vendorMiscScript.type = 'module';
                    console.log('🎯 Loading vendor-misc - should work now!');
                    
                    vendorMiscScript.onload = () => {
                        console.log('🎉 VENDOR MISC LOADED WITHOUT ERRORS!');
                        
                        // Finally load the main app bundle
                        const mainScript = document.createElement('script');
                        mainScript.src = '/assets/js/index-BdjqU1Nn.js';
                        mainScript.type = 'module';
                        document.head.appendChild(mainScript);
                        
                        mainScript.onload = () => {
                            console.log('🚀 SNAKKAZ SHOULD BE FULLY WORKING NOW!');
                        };
                    };
                    
                    document.head.appendChild(vendorMiscScript);
                };
                
                document.head.appendChild(reactDomScript);
            };
            
            document.head.appendChild(reactCoreScript);
        }
    </script>
</head>
<body>
    <div id="root">
        <div class="loading-screen">
            <h1>🛠️ SnakkaZ - Final Fix</h1>
            <p>Laster inn alle React-komponenter i riktig rekkefølge...</p>
            
            <div class="spinner"></div>
            
            <ul class="status-list">
                <li>React på window.React</li>
                <li>useLayoutEffect global</li>
                <li>Alle hooks tilgjengelig</li>
                <li>Module exports simulert</li>
                <li>use-sync-external-store fikset</li>
            </ul>
            
            <div id="debug-log" style="font-size: 12px; max-height: 150px; overflow-y: auto; width: 100%; max-width: 500px; background: rgba(0,0,0,0.2); border-radius: 4px; padding: 10px; margin-top: 20px; color: #e5e7eb;"></div>
        </div>
    </div>
    
    <script>
        // Start loading scripts after a short delay
        setTimeout(() => {
            loadAppScripts();
        }, 300);
    </script>
</body>
</html>
