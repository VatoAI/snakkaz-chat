    <title>SnakkaZ Chat</title>
    
    <!-- SUPER SPESIFIKK FIX: Definerer alt før bundles lastes -->
    <script>
    (function() {
        console.log('🚨 LOADING SUPER SPECIFIC REACT FIX');
        
        // Definer React med spesifikk fokus på useLayoutEffect
        window.React = window.React || {
            version: '18.2.0',
            useLayoutEffect: function(effect, deps) {
                console.log('⚡ Using polyfilled useLayoutEffect');
                if (typeof effect === 'function') setTimeout(effect, 0);
            },
            useState: function(initialState) {
                return [typeof initialState === 'function' ? initialState() : initialState, function() {}];
            },
            useEffect: function(effect, deps) {
                if (typeof effect === 'function') setTimeout(effect, 0);
            },
            useCallback: function(callback) { return callback; },
            useMemo: function(factory) { return typeof factory === 'function' ? factory() : factory; },
            useRef: function(initialValue) { return { current: initialValue }; },
            createElement: function() { return {}; },
            Fragment: 'Fragment'
        };
        
        // Fix Radix UI og bruk av useLayoutEffect
        window.useLayoutEffect = window.React.useLayoutEffect;
        
        // Definer ReactDOM
        window.ReactDOM = window.ReactDOM || {
            version: '18.2.0',
            createRoot: function(container) {
                return {
                    render: function(element) {
                        console.log('⚡ Polyfilled createRoot.render()');
                    }
                };
            }
        };
        
        // Definer useSyncExternalStore (brukt i vendor-misc)
        window.useSyncExternalStore = function(subscribe, getSnapshot) {
            console.log('⚡ Using polyfilled useSyncExternalStore');
            return getSnapshot();
        };
        
        console.log('✅ React polyfills loaded');
        console.log('React: ' + typeof window.React);
        console.log('useLayoutEffect: ' + typeof window.useLayoutEffect);
        console.log('useSyncExternalStore: ' + typeof window.useSyncExternalStore);
    })();
    </script>
    
    <!-- ORIGINAL START - Normal head innhold -->
    <link rel="stylesheet" href="/assets/auth-bg.css" />
    
    <!-- Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';

      font-src 'self' data:;

                  *.snakkaz.com dash.snakkaz.com business.snakkaz.com docs.snakkaz.com analytics.snakkaz.com;

    <!-- MANUELL BUNDLE LOADING I RIKTIG REKKEFØLGE -->
    <script>
        // Vent til dokumentet er lastet
        window.addEventListener('DOMContentLoaded', function() {
            // Vis loading skjerm
            document.body.innerHTML = `
                <div id="root">
                    <div style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%); color: white; font-family: sans-serif;">
                        <h1>⚡ SnakkaZ - Loading...</h1>
                        <p>Laster React i riktig rekkefølge...</p>
                        <div style="width: 50px; height: 50px; border: 5px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: white; animation: spin 1s infinite linear;"></div>
                        <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); }}</style>
                        <div id="status" style="margin-top: 20px; font-size: 14px;"></div>
                    </div>
                </div>
            `;
            
            const status = document.getElementById('status');
            
            // Helper for status updates
            function updateStatus(message) {
                const line = document.createElement('div');
                line.textContent = message;
                status.appendChild(line);
                console.log(message);
            }
            
            updateStatus('🚀 Starter lasting av bundles...');
            
            // Funksjoner for å laste scripts i rekkefølge
            function loadScript(src, callback) {
                const script = document.createElement('script');
                script.type = 'module';
                script.src = src;
                script.crossOrigin = '';
                
                script.onload = callback;
                script.onerror = function() {
                    updateStatus('❌ Feil ved lasting av: ' + src);
                };
                
                document.head.appendChild(script);
                updateStatus('⏳ Laster: ' + src);
            }
            
            // Last scripts i korrekt rekkefølge
            setTimeout(function() {
                // 1. Last React core først
                loadScript('/assets/js/vendor-react-core-BfIF1-qE.js', function() {
                    updateStatus('✅ React core lastet');
                    
                    // 2. Last React DOM etter React core
                    loadScript('/assets/js/vendor-react-dom-1Lp3Rl7J.js', function() {
                        updateStatus('✅ React DOM lastet');
                        
                        // 3. Last vendor-misc etter React DOM
                        loadScript('/assets/js/vendor-misc-CvNb75W7.js', function() {
                            updateStatus('✅ vendor-misc lastet');
                            
                            // 4. Last hovedappen til slutt
                            loadScript('/assets/js/index-BdjqU1Nn.js', function() {
                                updateStatus('✅ Hovedapp lastet');
                            });
                        });
                    });
                });
            }, 300);
        });
    </script>
</head>
<body>
    <div id="root">
        <!-- App vil bli rendret her -->
        <div style="display: flex; justify-content: center; align-items: center; height: 100vh; background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%); color: white; font-family: sans-serif;">
            <div style="text-align: center;">
                <h1>⚡ SnakkaZ - Starter opp...</h1>
                <p>Vennligst vent mens appen laster</p>
            </div>
        </div>
    </div>
</body>
