<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/snakkaz-icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>SnakkaZ Chat</title>
    
    <!-- 🚨 ULTRA-ROBUST REACT POLYFILL MED USELAYOUTEFFECT FIX -->
    <script>
    console.log('🚨 LOADING ULTRA-ROBUST REACT POLYFILL...');
    
    if (typeof window !== 'undefined') {
        // ULTRA-komplett React object som håndterer ALT
        const createReactHook = (name, defaultReturn) => {
            return function(...args) {
                console.log(`React.${name} called with:`, args);
                try {
                    if (typeof defaultReturn === 'function') {
                        return defaultReturn(...args);
                    }
                    return defaultReturn;
                } catch (e) {
                    console.warn(`React.${name} error handled:`, e);
                    return defaultReturn;
                }
            };
        };
        
        window.React = {
            version: '18.2.0',
            
            // State hooks med error handling
            useState: createReactHook('useState', (initialState) => {
                const state = typeof initialState === 'function' ? initialState() : initialState;
                return [state, () => {}];
            }),
            
            useReducer: createReactHook('useReducer', (reducer, initialArg) => [initialArg, () => {}]),
            
            // Effect hooks med spesiell useLayoutEffect behandling
            useEffect: createReactHook('useEffect', (effect, deps) => {
                if (typeof effect === 'function') {
                    try {
                        const cleanup = effect();
                        return typeof cleanup === 'function' ? cleanup : undefined;
                    } catch (e) {
                        console.warn('useEffect error:', e);
                    }
                }
            }),
            
            // 🔥 SPESIELL USELAYOUTEFFECT - problemet er her!
            useLayoutEffect: function(effect, deps) {
                console.log('React.useLayoutEffect called - CRITICAL FIX');
                if (typeof effect === 'function') {
                    try {
                        // Kjør umiddelbart siden vi ikke har DOM rendering cycle
                        const cleanup = effect();
                        console.log('useLayoutEffect executed successfully');
                        return typeof cleanup === 'function' ? cleanup : undefined;
                    } catch (e) {
                        console.warn('useLayoutEffect error handled:', e);
                        return () => {};
                    }
                }
                return () => {};
            },
            
            // Ref hooks
            useRef: createReactHook('useRef', (initialValue) => ({ current: initialValue })),
            
            useImperativeHandle: createReactHook('useImperativeHandle', () => {}),
            
            // Callback hooks
            useCallback: createReactHook('useCallback', (callback) => callback),
            
            useMemo: createReactHook('useMemo', (factory) => {
                return typeof factory === 'function' ? factory() : factory;
            }),
            
            // Context hooks
            useContext: createReactHook('useContext', (context) => {
                return context._currentValue || context.defaultValue || {};
            }),
            
            // Transition hooks
            useTransition: createReactHook('useTransition', () => [false, () => {}]),
            
            useDeferredValue: createReactHook('useDeferredValue', (value) => value),
            
            // ID hook
            useId: createReactHook('useId', () => 'react-id-' + Math.random().toString(36).substr(2, 9)),
            
            // 🔥 CRITICAL: use-sync-external-store med FULL kompatibilitet
            useSyncExternalStore: function(subscribe, getSnapshot, getServerSnapshot) {
                console.log('React.useSyncExternalStore called - ULTRA FIX');
                try {
                    // Returner snapshot med fallback
                    if (typeof getSnapshot === 'function') {
                        const snapshot = getSnapshot();
                        console.log('useSyncExternalStore snapshot:', snapshot);
                        return snapshot;
                    }
                    if (typeof getServerSnapshot === 'function') {
                        const serverSnapshot = getServerSnapshot();
                        console.log('useSyncExternalStore server snapshot:', serverSnapshot);
                        return serverSnapshot;
                    }
                    return null;
                } catch (e) {
                    console.warn('useSyncExternalStore error handled:', e);
                    return null;
                }
            },
            
            // Core React functions
            createElement: createReactHook('createElement', (type, props, ...children) => {
                return { type, props: props || {}, children };
            }),
            
            cloneElement: createReactHook('cloneElement', (element, props, ...children) => {
                return { ...element, props: { ...element.props, ...props }, children };
            }),
            
            createRef: createReactHook('createRef', () => ({ current: null })),
            
            // Components
            Fragment: 'React.Fragment',
            StrictMode: function(props) { return props.children; },
            Suspense: function(props) { return props.children; },
            
            Component: function(props) { 
                this.props = props; 
                this.setState = () => {};
                this.forceUpdate = () => {};
            },
            
            PureComponent: function(props) { 
                this.props = props;
                this.setState = () => {};
                this.forceUpdate = () => {};
            },
            
            // Context
            createContext: createReactHook('createContext', (defaultValue) => ({
                Provider: function(props) { return props.children; },
                Consumer: function(props) { return props.children; },
                _currentValue: defaultValue,
                defaultValue: defaultValue
            })),
            
            // Forward ref
            forwardRef: createReactHook('forwardRef', (render) => render),
            
            // Lazy loading
            lazy: createReactHook('lazy', (factory) => factory),
            
            // Error boundaries
            isValidElement: (object) => object != null && typeof object === 'object'
        };
        
        // ReactDOM object
        window.ReactDOM = {
            version: '18.2.0',
            render: function(element, container) {
                console.log('ReactDOM.render called');
                if (container && container.innerHTML !== undefined) {
                    container.innerHTML = '<div style="padding: 20px; text-align: center;">SnakkaZ Loading...</div>';
                }
            },
            createRoot: function(container) {
                console.log('ReactDOM.createRoot called');
                return {
                    render: function(element) {
                        console.log('Root.render called');
                        if (container && container.innerHTML !== undefined) {
                            container.innerHTML = '<div style="padding: 20px; text-align: center;">SnakkaZ App Loading...</div>';
                        }
                    },
                    unmount: function() {
                        console.log('Root.unmount called');
                    }
                };
            }
        };
        
        // 🔥 ALLE GLOBALE REACT HOOKS
        Object.keys(window.React).forEach(key => {
            if (key.startsWith('use') && typeof window.React[key] === 'function') {
                window[key] = window.React[key];
            }
        });
        
        // Spesielle globale objekter
        window.useSyncExternalStoreShim = {
            useSyncExternalStore: window.React.useSyncExternalStore
        };
        
        // DevTools
        window.__REACT_DEVTOOLS_GLOBAL_HOOK__ = {
            isDisabled: true,
            supportsFiber: true,
            inject: () => {},
            onCommitFiberRoot: () => {},
            onCommitFiberUnmount: () => {}
        };
        
        console.log('✅ ULTRA-ROBUST React polyfill loaded!');
        console.log('🔥 useLayoutEffect specifically handled');
        console.log('📦 ALL React hooks globally available');
    }
    </script>
    
    <link rel="stylesheet" href="/assets/auth-bg.css" />
    
    <style>
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    .loading-spinner {
        border: 3px solid #fff;
        border-radius: 50%;
        border-top: 3px solid transparent;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto;
    }
    </style>
</head>
<body>
    <div id="root">
        <div style="padding: 40px; text-align: center; font-family: Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; min-height: 100vh;">
            <h1>🛠️ SnakkaZ Ultra Fix</h1>
            <p>Ultra-robust React polyfill med useLayoutEffect fix!</p>
            <div style="margin: 20px 0;">
                <div class="loading-spinner"></div>
            </div>
            <p><small>Appen skal starte om litt...</small></p>
            <div style="margin-top: 20px; font-size: 12px; opacity: 0.8;">
                <p>✅ React polyfill aktiv</p>
                <p>✅ useLayoutEffect spesialbehandlet</p>
                <p>✅ useSyncExternalStore robust</p>
                <p>✅ Alle hooks globale</p>
            </div>
        </div>
    </div>
    
    <!-- Last bundles med enda lengre delay for sikkerhet -->
    <script>
    setTimeout(() => {
        console.log('🚀 Loading React bundles with extended delay...');
        
        // Load React Core først med error handling
        const reactCore = document.createElement('script');
        reactCore.type = 'module';
        reactCore.src = '/assets/js/vendor-react-core-BfIF1-qE.js';
        reactCore.onerror = (e) => console.error('React Core failed to load:', e);
        reactCore.onload = () => {
            console.log('✅ React Core loaded');
            
            setTimeout(() => {
                const reactDOM = document.createElement('script');
                reactDOM.type = 'module';
                reactDOM.src = '/assets/js/vendor-react-dom-1Lp3Rl7J.js';
                reactDOM.onerror = (e) => console.error('React DOM failed to load:', e);
                reactDOM.onload = () => {
                    console.log('✅ React DOM loaded');
                    
                    setTimeout(() => {
                        const vendorMisc = document.createElement('script');
                        vendorMisc.type = 'module';
                        vendorMisc.src = '/assets/js/vendor-misc-CvNb75W7.js';
                        vendorMisc.onerror = (e) => console.error('Vendor Misc failed to load:', e);
                        vendorMisc.onload = () => {
                            console.log('✅ Vendor Misc loaded (should be error-free now!)');
                            
                            setTimeout(() => {
                                const mainApp = document.createElement('script');
                                mainApp.type = 'module';
                                mainApp.src = '/assets/js/index-BdjqU1Nn.js';
                                mainApp.onerror = (e) => console.error('Main app failed to load:', e);
                                mainApp.onload = () => {
                                    console.log('🎉 MAIN APP LOADED - SNAKKAZ SHOULD BE WORKING!');
                                };
                                document.head.appendChild(mainApp);
                            }, 200);
                        };
                        document.head.appendChild(vendorMisc);
                    }, 200);
                };
                document.head.appendChild(reactDOM);
            }, 200);
        };
        document.head.appendChild(reactCore);
    }, 300);
    </script>
</body>
</html>
