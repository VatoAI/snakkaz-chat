# CloudMCP.run Deployment Configuration
name: snakkaz-chat-pro
version: 1.0.0
description: "Professional E2EE Chat with AI Assistant and Real-time Analytics"

# Runtime Configuration
runtime: node18
entry_point: server.js
timeout: 30000

# Scaling Configuration
scaling:
  min_instances: 1
  max_instances: 10
  target_cpu: 70
  target_memory: 80

# Regional Deployment
regions:
  - us-east-1
  - eu-west-1
  - ap-southeast-1

# Environment Variables
environment:
  NODE_ENV: production
  MCP_LOG_LEVEL: info
  SNAKKAZ_VERSION: "1.0.0"

# Resource Limits
resources:
  memory: 512MB
  cpu: 0.5
  storage: 1GB

# Health Check
health_check:
  path: /health
  interval: 30
  timeout: 5
  retries: 3

# Monitoring
monitoring:
  metrics: true
  logs: true
  traces: true
  alerts:
    - type: error_rate
      threshold: 5%
    - type: response_time
      threshold: 1000ms

# Security
security:
  oauth_required: true
  rate_limiting:
    requests_per_minute: 100
  cors:
    enabled: true
    origins: ["https://snakkaz.com", "https://*.snakkaz.com"]

# MCP Specific Configuration
mcp:
  protocol_version: "0.1.0"
  capabilities:
    - tools
    - resources
    - prompts
  tools:
    - snakkaz_chat_status
    - snakkaz_send_message
    - snakkaz_get_analytics
    - snakkaz_create_room
    - snakkaz_ai_assistant
