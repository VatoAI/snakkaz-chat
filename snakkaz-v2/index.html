<!DOCTYPE html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SnakkaZ Beta V2 - Helt Ny Norwegian Chat</title>
    
    <!-- Modern Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
      /* Global Reset & Variables */
      :root {
        --primary-bg: #000814;
        --secondary-bg: #001122;
        --accent-bg: #002244;
        --glass-bg: rgba(0, 34, 68, 0.1);
        --text-primary: #ffffff;
        --text-secondary: #94a3b8;
        --accent-blue: #00d4ff;
        --accent-purple: #8b5cf6;
        --accent-green: #10b981;
        --accent-orange: #f59e0b;
        --border-glass: rgba(255, 255, 255, 0.1);
        --shadow-glow: 0 0 30px rgba(0, 212, 255, 0.3);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        height: 100%;
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
        background: var(--primary-bg);
        color: var(--text-primary);
        overflow: hidden;
      }

      #root {
        height: 100vh;
        width: 100vw;
      }

      /* Modern Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: linear-gradient(45deg, var(--accent-blue), var(--accent-purple));
        border-radius: 10px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(45deg, var(--accent-purple), var(--accent-blue));
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Modern Loading Screen -->
      <div style="
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: linear-gradient(135deg, #000814 0%, #001122 50%, #002244 100%);
        position: relative;
        overflow: hidden;
      ">
        <!-- Animated Background -->
        <div style="
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          background: radial-gradient(circle at 20% 80%, rgba(0, 212, 255, 0.1) 0%, transparent 50%),
                      radial-gradient(circle at 80% 20%, rgba(139, 92, 246, 0.1) 0%, transparent 50%);
          animation: float 6s ease-in-out infinite;
        "></div>

        <!-- Logo & Spinner -->
        <div style="
          width: 120px;
          height: 120px;
          border: 4px solid transparent;
          border-top: 4px solid var(--accent-blue);
          border-right: 4px solid var(--accent-purple);
          border-radius: 50%;
          animation: spin 2s linear infinite;
          margin-bottom: 30px;
          box-shadow: var(--shadow-glow);
          position: relative;
          z-index: 10;
        "></div>

        <!-- V2 Title -->
        <h1 style="
          font-family: 'Orbitron', monospace;
          font-size: 42px;
          font-weight: 900;
          background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-purple) 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
          margin-bottom: 15px;
          letter-spacing: 3px;
          z-index: 10;
          position: relative;
        ">SNAKKAZ V2</h1>

        <!-- Subtitle -->
        <p style="
          font-size: 18px;
          color: var(--text-secondary);
          margin-bottom: 8px;
          z-index: 10;
          position: relative;
        ">Norwegian Next-Gen Chat Platform</p>

        <!-- Status -->
        <div style="
          background: rgba(16, 185, 129, 0.2);
          color: var(--accent-green);
          padding: 8px 16px;
          border-radius: 20px;
          font-size: 14px;
          font-weight: 600;
          border: 1px solid rgba(16, 185, 129, 0.3);
          z-index: 10;
          position: relative;
        ">🚀 Loading Ultra-Modern Experience...</div>
      </div>
    </div>

    <style>
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes float {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-20px) scale(1.05); }
      }
    </style>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
