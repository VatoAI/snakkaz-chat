name: 🐛 Bug Report
description: Report a bug in Snakkaz Chat
title: "[BUG] "
labels: ["bug", "needs-triage"]

body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear description of the bug
      placeholder: Describe what happened...
    validations:
      required: true
      
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. See error
    validations:
      required: true
      
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
    validations:
      required: true
      
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Production (snakkaz.com)
        - Development (localhost)
        - Staging
    validations:
      required: true
