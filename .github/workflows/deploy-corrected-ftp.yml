name: Deploy Snakkaz Chat - CORRECTED FTP

# 🚨 CORRECTED VERSION with proper FTP credentials from cPanel screenshots
# Server: ftp.snakkaz.com (not snakkaz.com)
# Username: snakqsqe (not snakkaz.com)
# Path: /home/snakqsqe/public_html

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
        continue-on-error: false

      - name: Build project
        run: |
          echo "🚀 Building with emergency React fixes for 'Nt undefined' error..."
          npm run build --no-lint
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_APP_URL: 'https://www.snakkaz.com'
          VITE_API_ENDPOINT: 'https://api.snakkaz.com'
          VITE_APP_ENV: 'production'
          VITE_BUILD_TIME: ${{ github.run_id }}
          
      - name: Add .htaccess file
        run: |
          cat > dist/.htaccess << EOF
          # Emergency .htaccess for Snakkaz Chat
          RewriteEngine On
          RewriteCond %{HTTPS} off
          RewriteRule (.*) https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
          
          # SPA routing
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteRule ^index\.html$ - [L]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /index.html [L]
          </IfModule>
          
          # MIME types for React bundles
          <IfModule mod_mime.c>
            AddType text/css .css
            AddType text/javascript .js
            AddType application/javascript .mjs
            AddType application/json .json
          </IfModule>
          
          # CORS for Norwegian domain
          <IfModule mod_headers.c>
            Header set Access-Control-Allow-Origin "*"
          </IfModule>
          EOF
      
      - name: Validate build output
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "❌ Build failed, index.html not found"
            exit 1
          fi
          echo "✅ Build validation successful"
          echo "📋 New bundle files:"
          ls -la dist/assets/ | grep -E "(index|vendor)"
          
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Create LFTP script with CORRECTED credentials
        run: |
          echo "🚨 Using CORRECTED FTP credentials from cPanel screenshots"
          echo "Server: ftp.snakkaz.com"
          echo "Username: snakqsqe" 
          echo "Path: /home/snakqsqe/public_html"
          
          cat > upload-corrected.lftp << EOF
          # CORRECTED FTP credentials from cPanel screenshots
          open -u snakqsqe,${{ secrets.FTP_PASSWORD }} ftp.snakkaz.com
          set ssl:verify-certificate no
          set ftp:ssl-allow yes
          set ftp:ssl-protect-data yes
          set ftp:ssl-protect-list yes
          set net:timeout 60
          set net:max-retries 10
          set net:reconnect-interval-base 5
          set cmd:fail-exit yes
          
          # Navigate to public_html
          cd /home/snakqsqe/public_html
          
          # Upload with parallel transfers
          mirror -R dist/ ./ --no-perms --parallel=3 --verbose
          
          # Verify upload
          echo "Listing uploaded files:"
          ls -la assets/
          
          bye
          EOF
          
      - name: Deploy using LFTP with CORRECTED credentials
        id: deploy-lftp-corrected
        run: |
          echo "🚀 Starting CORRECTED LFTP deployment..."
          echo "This should fix the 503 Access Denied errors we've been getting"
          lftp -f upload-corrected.lftp
          echo "✅ CORRECTED LFTP deployment completed"
        continue-on-error: true
        timeout-minutes: 10
        
      - name: Fallback - Direct curl upload if LFTP fails
        if: steps.deploy-lftp-corrected.outcome != 'success'
        run: |
          echo "❌ LFTP failed, trying direct curl with corrected credentials..."
          
          # Upload index.html
          curl -v -T dist/index.html --user "snakqsqe:${{ secrets.FTP_PASSWORD }}" \
            "ftp://ftp.snakkaz.com/home/snakqsqe/public_html/index.html"
          
          # Upload main bundle
          for file in dist/assets/index-*.js; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              curl -v -T "$file" --user "snakqsqe:${{ secrets.FTP_PASSWORD }}" \
                "ftp://ftp.snakkaz.com/home/snakqsqe/public_html/assets/$filename"
            fi
          done
          
          # Upload vendor bundle  
          for file in dist/assets/vendor-*.js; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              curl -v -T "$file" --user "snakqsqe:${{ secrets.FTP_PASSWORD }}" \
                "ftp://ftp.snakkaz.com/home/snakqsqe/public_html/assets/$filename"
            fi
          done
          
          echo "✅ Fallback curl upload completed"
      
      - name: Verify deployment
        run: |
          echo "🔍 Verifying deployment on live site..."
          
          # Wait a moment for files to propagate
          sleep 10
          
          # Check if site responds
          if curl -s -o /dev/null -w "%{http_code}" "https://www.snakkaz.com" | grep -q "200"; then
            echo "✅ Site responds with HTTP 200"
          else
            echo "⚠️ Site may not be responding correctly"
          fi
          
          # Check for the new bundle in the HTML
          if curl -s "https://www.snakkaz.com" | grep -q "index-CEa86-6h.js"; then
            echo "✅ NEW bundle detected on live site!"
          else
            echo "⚠️ OLD bundle still detected - deployment may need more time"
          fi
      
      - name: Deployment Summary
        if: always()
        run: |
          echo "# 🚨 EMERGENCY DEPLOYMENT REPORT - CORRECTED FTP" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎯 Deployment Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Target:** Norwegian tech community chat (www.snakkaz.com)" >> $GITHUB_STEP_SUMMARY
          echo "- **Fix:** 'Nt is undefined' React error causing black screen" >> $GITHUB_STEP_SUMMARY
          echo "- **FTP Server:** ftp.snakkaz.com (CORRECTED)" >> $GITHUB_STEP_SUMMARY
          echo "- **FTP User:** snakqsqe (CORRECTED)" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed at:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ steps.deploy-lftp-corrected.outcome }}" == "success" ]]; then
            echo "### ✅ LFTP Deployment (CORRECTED)" >> $GITHUB_STEP_SUMMARY
            echo "Primary deployment successful with corrected FTP credentials." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ LFTP Deployment" >> $GITHUB_STEP_SUMMARY
            echo "LFTP had issues, fallback curl method was used." >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔍 Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. **Verify site:** https://www.snakkaz.com" >> $GITHUB_STEP_SUMMARY
          echo "2. **Check console:** No 'Nt is undefined' errors" >> $GITHUB_STEP_SUMMARY  
          echo "3. **Confirm bundles:** New bundle names should be loaded" >> $GITHUB_STEP_SUMMARY
          echo "4. **Test chat:** Norwegian users should be able to access chat" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🇳🇴 **For norske brukere:** Chat-appen skal nå fungere uten sorte skjermer!" >> $GITHUB_STEP_SUMMARY
