name: Deploy SnakkaZ Production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "18"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: snakkaz-production/package-lock.json

      - name: Install dependencies
        run: |
          cd snakkaz-production
          npm ci

      - name: Run tests
        run: |
          cd snakkaz-production
          npm run test:ci

      - name: Type check
        run: |
          cd snakkaz-production
          npm run type-check

      - name: Lint
        run: |
          cd snakkaz-production
          npm run lint

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: snakkaz-production/package-lock.json

      - name: Install dependencies
        run: |
          cd snakkaz-production
          npm ci

      - name: Build production app
        run: |
          cd snakkaz-production
          npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_MCP_API_URL: ${{ secrets.VITE_MCP_API_URL }}
          VITE_MCP_API_KEY: ${{ secrets.VITE_MCP_API_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: snakkaz-production/dist/
          retention-days: 30

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: dist/

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # Backup current version
            if [ -d "/var/www/snakkaz.com" ]; then
              sudo mv /var/www/snakkaz.com /var/www/snakkaz.com.backup.$(date +%Y%m%d_%H%M%S)
            fi

            # Create new directory
            sudo mkdir -p /var/www/snakkaz.com
            sudo chown $USER:$USER /var/www/snakkaz.com

      - name: Upload files via RSYNC
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avzr --delete --exclude='.git*' --exclude='node_modules'
          path: dist/
          remote_path: /var/www/snakkaz.com/
          remote_host: ${{ secrets.PRODUCTION_HOST }}
          remote_user: ${{ secrets.PRODUCTION_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Restart services
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # Restart nginx
            sudo systemctl reload nginx

            # Restart PM2 processes if applicable
            if command -v pm2 &> /dev/null; then
              pm2 restart all
            fi

            # Clear CDN cache if using one
            echo "Production deployment completed successfully!"

      - name: Health check
        run: |
          sleep 30
          curl -f https://www.snakkaz.com || exit 1
          echo "✅ Health check passed - SnakkaZ is live!"

      - name: Notify deployment
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: ${{ job.status }}
          text: |
            SnakkaZ deployment ${{ job.status }}!
            🚀 Live at: https://www.snakkaz.com
            📊 Revenue ready: Stripe + Vipps integrated
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
