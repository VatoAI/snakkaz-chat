name: 🚀 Snakkaz Unified Deployment

# UNIFIED DEPLOYMENT WORKFLOW - Consolidated from 8 separate workflows
# Handles all deployment scenarios with proper fallbacks and monitoring

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deployment_type:
        description: 'Deployment type'
        required: false
        default: 'standard'
        type: choice
        options:
        - standard
        - emergency
        - rebuild

jobs:
  # Phase 1: Build and Validate
  build:
    name: 📦 Build Application
    runs-on: ubuntu-latest
    outputs:
      build-success: ${{ steps.build-check.outputs.success }}
      bundle-hash: ${{ steps.bundle-info.outputs.hash }}
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps
        
      - name: 🔍 Lint code
        run: npm run lint
        continue-on-error: false
        
      - name: 🏗️ Build application
        run: npm run build:prod
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_APP_URL: 'https://www.snakkaz.com'
          VITE_API_ENDPOINT: 'https://api.snakkaz.com'
          VITE_APP_ENV: 'production'
          VITE_BUILD_TIME: ${{ github.run_id }}
          
      - name: ✅ Validate build
        id: build-check
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "❌ Build failed - index.html not found"
            echo "success=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "✅ Build validation successful"
          echo "success=true" >> $GITHUB_OUTPUT
          
      - name: 📊 Bundle information
        id: bundle-info
        run: |
          BUNDLE_COUNT=$(ls dist/assets/js/*.js | wc -l)
          MAIN_BUNDLE=$(ls dist/assets/js/index-*.js | head -1 | xargs basename)
          echo "📦 Bundle count: $BUNDLE_COUNT"
          echo "📦 Main bundle: $MAIN_BUNDLE"
          echo "hash=${MAIN_BUNDLE#index-}" >> $GITHUB_OUTPUT
          
      - name: 📁 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: snakkaz-build-${{ github.run_id }}
          path: dist/
          retention-days: 7

  # Phase 2: Deploy to Production
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.build-success == 'true'
    
    steps:
      - name: 📥 Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: snakkaz-build-${{ github.run_id }}
          path: dist/
          
      - name: 🔧 Add .htaccess configuration
        run: |
          cat > dist/.htaccess << 'EOF'
          # Snakkaz Chat Production Configuration
          RewriteEngine On
          
          # Force HTTPS
          RewriteCond %{HTTPS} off
          RewriteRule (.*) https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
          
          # SPA routing for React
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteRule ^index\.html$ - [L]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /index.html [L]
          </IfModule>
          
          # MIME types for modern web
          <IfModule mod_mime.c>
            AddType text/css .css
            AddType text/javascript .js .mjs
            AddType application/json .json
            AddType image/webp .webp
          </IfModule>
          
          # Security headers
          <IfModule mod_headers.c>
            Header always set X-Content-Type-Options nosniff
            Header always set X-Frame-Options DENY
            Header always set X-XSS-Protection "1; mode=block"
            Header always set Referrer-Policy "strict-origin-when-cross-origin"
            Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
          </IfModule>
          
          # Compression
          <IfModule mod_deflate.c>
            AddOutputFilterByType DEFLATE text/plain
            AddOutputFilterByType DEFLATE text/html
            AddOutputFilterByType DEFLATE text/xml
            AddOutputFilterByType DEFLATE text/css
            AddOutputFilterByType DEFLATE application/xml
            AddOutputFilterByType DEFLATE application/xhtml+xml
            AddOutputFilterByType DEFLATE application/rss+xml
            AddOutputFilterByType DEFLATE application/javascript
            AddOutputFilterByType DEFLATE application/x-javascript
          </IfModule>
          
          # Cache control
          <IfModule mod_expires.c>
            ExpiresActive On
            ExpiresByType text/css "access plus 1 year"
            ExpiresByType application/javascript "access plus 1 year"
            ExpiresByType image/png "access plus 1 year"
            ExpiresByType image/jpg "access plus 1 year"
            ExpiresByType image/jpeg "access plus 1 year"
            ExpiresByType image/gif "access plus 1 year"
            ExpiresByType image/webp "access plus 1 year"
          </IfModule>
          EOF
          
      - name: 📤 Deploy via FTP (Primary Method)
        id: deploy-ftp
        run: |
          # Install lftp for reliable FTP deployment
          sudo apt-get update && sudo apt-get install -y lftp
          
          # Create LFTP deployment script
          cat > deploy.lftp << 'EOF'
          set ftp:list-options -a
          set ftp:passive-mode true
          set ftp:ssl-allow no
          set net:reconnect-interval-base 5
          set net:max-retries 3
          
          open ftp://ftp.snakkaz.com
          user $FTP_USERNAME $FTP_PASSWORD
          lcd dist
          cd /public_html
          
          # Mirror deployment with overwrite
          mirror --reverse --delete --verbose --parallel=3
          
          quit
          EOF
          
          # Execute deployment
          lftp -f deploy.lftp
          
          if [ $? -eq 0 ]; then
            echo "✅ LFTP deployment successful"
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ LFTP deployment failed, trying fallback"
            echo "success=false" >> $GITHUB_OUTPUT
          fi
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        continue-on-error: true
        
      - name: 📤 Deploy via cURL (Fallback Method)
        if: steps.deploy-ftp.outputs.success != 'true'
        run: |
          echo "🔄 Using cURL fallback deployment method..."
          
          # Upload index.html
          curl -T "dist/index.html" \
            --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            "ftp://ftp.snakkaz.com/public_html/index.html"
          
          # Upload .htaccess
          curl -T "dist/.htaccess" \
            --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            "ftp://ftp.snakkaz.com/public_html/.htaccess"
            
          # Upload main bundle
          for file in dist/assets/js/index-*.js; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              curl -T "$file" \
                --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
                "ftp://ftp.snakkaz.com/public_html/assets/js/$filename"
            fi
          done
          
          # Upload primary vendor bundle
          for file in dist/assets/js/vendor-misc-*.js; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              curl -T "$file" \
                --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
                "ftp://ftp.snakkaz.com/public_html/assets/js/$filename"
            fi
          done
          
          echo "✅ cURL fallback deployment completed"

  # Phase 3: Verify Deployment
  verify:
    name: ✅ Verify Deployment
    runs-on: ubuntu-latest
    needs: [build, deploy]
    
    steps:
      - name: 🔍 Test live site
        run: |
          echo "🌐 Testing https://www.snakkaz.com..."
          
          # Wait for propagation
          sleep 30
          
          # Test site response
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://www.snakkaz.com)
          
          if [ "$RESPONSE" = "200" ]; then
            echo "✅ Site is responding with HTTP 200"
          else
            echo "❌ Site returned HTTP $RESPONSE"
            exit 1
          fi
          
      - name: 🔍 Test bundle loading
        run: |
          echo "📦 Testing bundle loading..."
          
          # Test if new bundle is referenced
          BUNDLE_HASH="${{ needs.build.outputs.bundle-hash }}"
          
          if curl -s https://www.snakkaz.com | grep -q "$BUNDLE_HASH"; then
            echo "✅ New bundle ($BUNDLE_HASH) is referenced in HTML"
          else
            echo "⚠️ Bundle reference not found - may need cache propagation"
          fi
          
      - name: 🔍 Test Norwegian features
        run: |
          echo "🇳🇴 Testing Norwegian tech community features..."
          
          # Test for Norwegian content
          if curl -s https://www.snakkaz.com | grep -q "SnakkaZ"; then
            echo "✅ Norwegian branding present"
          fi
          
          # Test for chat functionality indicators
          if curl -s https://www.snakkaz.com | grep -q "chat"; then
            echo "✅ Chat functionality indicators present"
          fi

  # Phase 4: Monitoring and Notifications
  monitor:
    name: 📊 Post-Deployment Monitoring
    runs-on: ubuntu-latest
    needs: [build, deploy, verify]
    if: always()
    
    steps:
      - name: 📊 Generate deployment summary
        run: |
          echo "# 🚀 Snakkaz Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📋 Deployment Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Date**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Bundle Hash**: \`${{ needs.build.outputs.bundle-hash }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Build status
          if [ "${{ needs.build.result }}" = "success" ]; then
            echo "✅ **Build**: Successful" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Build**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Deploy status
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "✅ **Deploy**: Successful" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Deploy**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Verify status
          if [ "${{ needs.verify.result }}" = "success" ]; then
            echo "✅ **Verify**: Successful" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Verify**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🔗 Quick Links" >> $GITHUB_STEP_SUMMARY
          echo "- [🌐 Live Site](https://www.snakkaz.com)" >> $GITHUB_STEP_SUMMARY
          echo "- [📊 Repository](https://github.com/VatoAI/snakkaz-chat)" >> $GITHUB_STEP_SUMMARY
          echo "- [📋 Documentation](https://github.com/VatoAI/snakkaz-chat/blob/main/README.md)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🇳🇴 **For Norwegian users**: Chat-appen skal nå være oppdatert og klar til bruk!" >> $GITHUB_STEP_SUMMARY
