# 🚀 SNAKKAZ DOCKER COMPOSE - WORLD DOMINATION STACK!

version: '3.8'

services:
  # Main SnakkaZ MCP Server
  snakkaz-mcp:
    build: .
    container_name: snakkaz-world-domination
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - MCP_SERVER_URL=mcp.snakkaz.com
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - PERFORMANCE_MODE=DOMINATION
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - snakkaz-network

  # Docker Model Runner - Local AI
  llama-ai:
    image: docker/model-runner:llama3.1
    container_name: snakkaz-ai-brain
    ports:
      - "8000:8000"
    environment:
      - GPU_ENABLED=true
      - MODEL_SIZE=8B
      - CONTEXT_LENGTH=32768
    volumes:
      - model-cache:/models
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - snakkaz-network

  # Vector Database for AI Memory
  vector-db:
    image: qdrant/qdrant:latest
    container_name: snakkaz-memory
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    networks:
      - snakkaz-network

  # Redis for Ultra-Fast Caching
  redis-cache:
    image: redis:7-alpine
    container_name: snakkaz-speed-cache
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    networks:
      - snakkaz-network

  # PostgreSQL for MCP Data
  postgres-db:
    image: postgres:15-alpine
    container_name: snakkaz-database
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=snakkaz_mcp
      - POSTGRES_USER=snakkaz
      - POSTGRES_PASSWORD=${DB_PASSWORD:-snakkaz_domination_2025}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./snakkaz-universal-schema.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - snakkaz-network

  # Analytics Dashboard
  analytics:
    build:
      context: .
      dockerfile: Dockerfile.analytics
    container_name: snakkaz-analytics
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://snakkaz:${DB_PASSWORD:-snakkaz_domination_2025}@postgres-db:5432/snakkaz_mcp
      - REDIS_URL=redis://redis-cache:6379
    depends_on:
      - postgres-db
      - redis-cache
    restart: unless-stopped
    networks:
      - snakkaz-network

  # Nginx Load Balancer & SSL
  nginx:
    image: nginx:alpine
    container_name: snakkaz-gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - snakkaz-mcp
      - analytics
    restart: unless-stopped
    networks:
      - snakkaz-network

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  model-cache:

networks:
  snakkaz-network:
    driver: bridge

# MCP Tools Integration (Docker Compose v4 feature)
x-mcp-tools:
  chat-tools:
    source: docker/mcp-catalog/chat-tools
    version: latest
  security-tools:
    source: docker/mcp-catalog/security-tools
    version: latest
  analytics-tools:
    source: docker/mcp-catalog/analytics-tools
    version: latest
