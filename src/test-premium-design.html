<!DOCTYPE html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SnakkaZ Premium Design Test</title>
    <style>
      /* Test våre premium CSS variabler direkte */
      :root {
        --cyber-void: #0a0a0a;
        --cyber-gold: #ffcc00;
        --glass-medium: rgba(255, 255, 255, 0.12);
      }

      body {
        margin: 0;
        background: var(--cyber-void);
        color: white;
        font-family: system-ui;
        padding: 2rem;
      }

      .test-card {
        background: var(--glass-medium);
        padding: 2rem;
        border-radius: 1rem;
        border: 1px solid rgba(255, 204, 0, 0.2);
        margin-bottom: 2rem;
      }

      .test-title {
        color: var(--cyber-gold);
        font-size: 2rem;
        margin-bottom: 1rem;
      }

      .test-button {
        background: linear-gradient(135deg, var(--cyber-gold), #00d4ff);
        border: none;
        padding: 1rem 2rem;
        border-radius: 0.5rem;
        color: black;
        font-weight: bold;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="test-card">
      <h1 class="test-title">🚀 SnakkaZ Premium Design Test</h1>
      <p>
        Hvis du ser gyllen tekst og glassmorphism-effekter, fungerer våre
        CSS-variabler!
      </p>
      <button class="test-button">Test Knapp</button>
    </div>

    <div class="test-card">
      <h2>CSS Variabler Status:</h2>
      <p>
        Cyber Void Background:
        <span
          style="
            background: var(--cyber-void);
            padding: 0.5rem;
            border: 1px solid white;
          "
          >Test</span
        >
      </p>
      <p>
        Cyber Gold:
        <span
          style="background: var(--cyber-gold); color: black; padding: 0.5rem"
          >Test</span
        >
      </p>
      <p>
        Glass Medium:
        <span
          style="
            background: var(--glass-medium);
            padding: 0.5rem;
            border: 1px solid white;
          "
          >Test</span
        >
      </p>
    </div>
  </body>
</html>
