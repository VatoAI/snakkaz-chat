    <script>
      (function() {
        'use strict';

          // Enhanced module resolution for React

            useRef: function(initialValue) {

                } catch (e) {
                  console.warn('Emergency useEffect error:', e);
                  return function(){};
                }
              }
              return function(){};
            },
            useLayoutEffect: function(effect, deps) {
              console.log('🔧 Emergency useLayoutEffect called');
              if (typeof effect === 'function') {
                try {

                  return typeof cleanup === 'function' ? cleanup : function(){};
                } catch (e) {
                  console.warn('Emergency useLayoutEffect error:', e);
                  return function(){};
                }
              }
              return function(){};
            },
            useState: function(initialState) {
              console.log('🔧 Emergency useState called');
              var state = initialState;
              var setState = function(newState) {
                if (typeof newState === 'function') {
                  state = newState(state);
                } else {
                  state = newState;
                }
              };
              return [state, setState];
            },
            useMemo: function(factory, deps) {
              if (typeof factory === 'function') {
                try {

            console.log('🔧 Emergency useMergeRef called with refs:', refs.length, refs);
            
            return function(element) {
              if (refs && refs.length > 0) {
                refs.forEach(function(ref, index) {
                  if (!ref) {
                    console.log('🔧 Skipping null/undefined ref at index:', index);
                    return;
                  }
                  
                  if (typeof ref === 'function') {
                    try {
                      ref(element);
                      console.log('🔧 Applied function ref at index:', index);
                    } catch (e) {
                      console.warn('Emergency useMergeRef function ref error at index:', index, e);
                    }
                  } else if (ref && typeof ref === 'object' && 'current' in ref) {
                    try {

                      console.log('🔧 Applied object ref at index:', index);
                    } catch (e) {
                      console.warn('Emergency useMergeRef object ref error at index:', index, e);
                    }
                  } else {

              }
