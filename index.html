<!DOCTYPE html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/snakkaz-icon-192.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="SnakkaZ Chat" />
    <link rel="apple-touch-icon" href="/icons/snakkaz-icon-192.png" />
    <title>SnakkaZ Chat - Beta</title>

    <!-- Emergency CSS Fix for Visibility -->
    <style>
      /* Force everything to be visible */
      html,
      body {
        margin: 0 !important;
        padding: 0 !important;
        background: #080811 !important;
        color: rgba(255, 255, 255, 0.9) !important;
        font-family: "Inter", system-ui, sans-serif !important;
      }

      #root {
        min-height: 100vh !important;
        background: #080811 !important;
        color: rgba(255, 255, 255, 0.9) !important;
        position: relative !important;
      }

      /* Emergency debug indicator */
      #root::before {
        content: "🚀 SnakkaZ Loading..." !important;
        position: fixed !important;
        top: 20px !important;
        left: 20px !important;
        background: rgba(0, 255, 0, 0.8) !important;
        color: black !important;
        padding: 10px !important;
        border-radius: 5px !important;
        z-index: 10000 !important;
        font-weight: bold !important;
      }

      /* Force any content to be visible */
      * {
        box-sizing: border-box !important;
      }

      .App {
        min-height: 100vh !important;
        background: #080811 !important;
        color: rgba(255, 255, 255, 0.9) !important;
      }
    </style>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Performance optimizations -->
    <link rel="dns-prefetch" href="https://wqpoozpbceucynsojmbk.supabase.co" />
    <link
      rel="preconnect"
      href="https://wqpoozpbceucynsojmbk.supabase.co"
      crossorigin
    />
  </head>
  <body style="background: #0a0a0a !important; margin: 0; padding: 0">
    <div id="root">
      <div
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          background: #0a0a0a;
          color: white;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui,
            sans-serif;
        "
      >
        <div
          style="
            width: 60px;
            height: 60px;
            border: 3px solid #ffd700;
            border-radius: 50%;
            border-top: 3px solid transparent;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
          "
        ></div>
        <h2
          style="
            margin: 0 0 10px 0;
            font-weight: 600;
            font-size: 24px;
            background: linear-gradient(135deg, #ffd700 0%, #4a90e2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
          "
        >
          SnakkaZ Beta - Premium
        </h2>
        <p style="margin: 0; opacity: 0.8; font-size: 16px">
          🎨 Laster premium design system...
        </p>
      </div>
    </div>

    <style>
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #0f172a;
        color: white;
      }
    </style>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
