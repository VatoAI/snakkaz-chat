    <!-- CRITICAL: Emergency React Hooks Fix -->
    <script>
      (function() {
        'use strict';
        console.log('🚀 SNAKKAZ: Emergency React hooks fix loading...');
        
        if (typeof window !== 'undefined') {
          // useLayoutEffect fix
          window.useLayoutEffect = window.useLayoutEffect || function(effect, deps) {
            console.log('🔧 Emergency useLayoutEffect called');
            if (typeof effect === 'function') {
              try {
                var cleanup = effect();
                return typeof cleanup === 'function' ? cleanup : function(){};
              } catch (e) {
                console.warn('Emergency useLayoutEffect error:', e);
                return function(){};
              }
            }
            return function(){};
          };
          
          // useMergeRef fix
          window.useMergeRef = window.useMergeRef || function() {
            var refs = Array.prototype.slice.call(arguments);
            console.log('🔧 Emergency useMergeRef called with refs:', refs.length);
            return function(element) {
              refs.forEach(function(ref) {
                if (typeof ref === 'function') {
                  try {
                    ref(element);
                  } catch (e) {
                    console.warn('Emergency useMergeRef function ref error:', e);
                  }
                } else if (ref && typeof ref === 'object' && 'current' in ref) {
                  try {
                    ref.current = element;
                  } catch (e) {
                    console.warn('Emergency useMergeRef object ref error:', e);
                  }
                }
              });
            };
          };
          
          // reactExports for vendor bundles
          window.reactExports = window.reactExports || {};
          window.reactExports.useLayoutEffect = window.useLayoutEffect;
          window.reactExports.useEffect = window.useLayoutEffect;
          window.reactExports.useState = function(initialState) {
            console.log('🔧 Emergency reactExports.useState called');
            var state = initialState;
            var setState = function(newState) {
              if (typeof newState === 'function') {
                state = newState(state);
              } else {
                state = newState;
              }
            };
            return [state, setState];
          };
          
          // React object patches
          window.React = window.React || {};
          window.React.useLayoutEffect = window.React.useLayoutEffect || window.useLayoutEffect;
          window.React.useMergeRef = window.React.useMergeRef || window.useMergeRef;
          
          // Framer Motion LayoutGroup fix
          window.__LAYOUT_GROUP_CONTEXT_FIX__ = true;
          
          window.__USE_SYNC_EXTERNAL_STORE_POLYFILL__ = true;
          
          console.log('✅ SNAKKAZ: All emergency React fixes applied successfully!');
        }
      })();
    </script>
    
    <!-- Production Assets - EXACT filenames from your cPanel -->
    <link rel="stylesheet" crossorigin href="/app-styles.css">
    <script type="module" crossorigin src="/app-main.js"></script>

<body>
    <div id="root"></div>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          console.log('🔄 SNAKKAZ: Registering service worker...');
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function(registration) {
              console.log('✅ SNAKKAZ: Service Worker registered successfully:', registration.scope);
              
              // Check for updates
              registration.addEventListener('updatefound', function() {
                console.log('🔄 SNAKKAZ: Service Worker update found');
                var newWorker = registration.installing;
                newWorker.addEventListener('statechange', function() {
                  if (newWorker.state === 'installed') {
                    if (navigator.serviceWorker.controller) {
                      console.log('🔄 SNAKKAZ: New content available, reload recommended');
                    } else {
                      console.log('✅ SNAKKAZ: Content cached for offline use');
                    }
                  }
                });
              });
            })
            .catch(function(registrationError) {
              console.log('❌ SNAKKAZ: Service Worker registration failed:', registrationError);
            });
        });
      } else {
        console.log('❌ SNAKKAZ: Service Worker not supported');
      }
    </script>
    
    <!-- PWA Install Prompt -->
    <script>
      window.addEventListener('beforeinstallprompt', function(e) {
        console.log('📱 SNAKKAZ: PWA install prompt available');
        e.preventDefault();
        window.deferredPrompt = e;
        
        // Show install button or notification
        var installButton = document.createElement('button');
        installButton.textContent = '📱 Installer SnakkaZ App';
        installButton.style.cssText = 'position: fixed; top: 10px; right: 10px; z-index: 9999; padding: 10px; background: #0f172a; color: white; border: none; border-radius: 8px; cursor: pointer;';
        
        installButton.addEventListener('click', function() {
          window.deferredPrompt.prompt();
          window.deferredPrompt.userChoice.then(function(choiceResult) {
            if (choiceResult.outcome === 'accepted') {
              console.log('✅ SNAKKAZ: PWA installed by user');
            } else {
              console.log('❌ SNAKKAZ: PWA installation dismissed');
            }
            window.deferredPrompt = null;
            installButton.remove();
          });
        });
        
        document.body.appendChild(installButton);
        
        // Auto-hide after 10 seconds
        setTimeout(function() {
          if (installButton.parentNode) {
            installButton.remove();
          }
        }, 10000);
      });
    </script>
    
    <!-- Performance Monitoring -->
    <script>
      window.addEventListener('load', function() {
        if ('performance' in window) {
          var loadTime = performance.timing.loadEventEnd - performance.timing.navigationStart;
          console.log('⚡ SNAKKAZ: Page loaded in ' + loadTime + 'ms');
          
          // Report Core Web Vitals
          if ('web-vitals' in window) {
            console.log('📊 SNAKKAZ: Web Vitals monitoring active');
          }
        }
      });
    </script>
